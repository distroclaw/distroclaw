[package]
name = "distroclaw"
version = "0.3.0"
description = "DistroClaw — local AI chat"
authors = ["DistroClaw"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "distroclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "macros", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Spreadsheets (xlsx, xls, ods) for read_file and Olymp, read in the sandboxed reader process.
calamine = "0.38"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tauri-plugin-dialog = "2"
# A second launch focuses the running window instead of starting a second engine.
tauri-plugin-single-instance = "2.5"
walkdir = "2"
globset = "0.4"
mime_guess = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Time",
] }
# Canonical paths without the \\?\ prefix, so they compare with and read like the paths people use.
dunce = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, so a panic in a library (e.g. a malformed PDF in pdf-extract) is caught and reported
# instead of taking the whole app down.
panic = "unwind"
strip = true
