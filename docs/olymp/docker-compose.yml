# SearXNG and Crawl4AI for Olymp, on this computer only (see docs/OLYMP.md).
#   SEARXNG_SECRET=$(openssl rand -hex 32) docker compose up -d
# Ports are published on 127.0.0.1 only: other computers on the network cannot reach them.
# Pin the image versions you tested before relying on this setup.

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET, e.g. SEARXNG_SECRET=$(openssl rand -hex 32)}
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    # The browser inside needs shared memory.
    shm_size: "1gb"
